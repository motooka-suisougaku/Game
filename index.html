<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>JS SURVIVOR - FULL SET</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0d0d1a; font-family: 'Segoe UI', sans-serif; touch-action: none; color: white; user-select: none; }
        canvas { display: block; }

        /* オーバーレイ共通 */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); z-index: 20; }
        .hidden { display: none !important; }

        h1 { font-size: 48px; color: #ffcc00; text-shadow: 0 0 15px #ffcc00; margin-bottom: 20px; }
        h2 { font-size: 32px; color: #00ffff; }

        select, button { font-size: 20px; padding: 12px 30px; margin: 10px; border-radius: 10px; background: #1a1a2e; color: white; border: 2px solid #444; cursor: pointer; transition: 0.3s; }
        select:hover, button:hover { border-color: #ffcc00; background: #2a2a4e; }

        /* ゲーム中UI */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; padding: 15px; box-sizing: border-box; pointer-events: none; z-index: 10; }
        .stats-row { display: flex; justify-content: space-between; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
        #timer { font-size: 32px; color: #ff4444; }
        #exp-container { width: 100%; height: 12px; background: #222; border: 1px solid #444; border-radius: 6px; margin-top: 10px; overflow: hidden; }
        #exp-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #00ff00, #00ffff); transition: width 0.1s; }

        /* スキル選択カード */
        .skill-list { display: flex; flex-direction: column; gap: 15px; width: 80%; max-width: 400px; }
        .skill-card { background: #1a1a2e; border: 2px solid #444; border-radius: 12px; padding: 15px; cursor: pointer; transition: 0.2s; text-align: center; }
        .skill-card:hover { transform: scale(1.05); border-color: #00ffff; background: #252545; }
        .skill-name { font-size: 22px; font-weight: bold; color: #00ffff; }
        .skill-desc { font-size: 14px; color: #ccc; margin-top: 5px; }

        #boss-warning { position: absolute; top: 25%; width: 100%; text-align: center; font-size: 50px; font-weight: bold; color: #ff0000; text-shadow: 0 0 20px #ff0000; display: none; z-index: 15; pointer-events: none; }
    </style>
</head>
<body>

    <div id="screen-home" class="overlay">
        <h1>JS SURVIVOR</h1>
        <p>5分間生存せよ。3分経過でボスが出現！</p>
        <select id="stage-select"></select>
        <button id="btn-start">START GAME</button>
    </div>

    <div id="screen-levelup" class="overlay hidden">
        <h2>SKILL UPGRADE</h2>
        <div id="skill-container" class="skill-list"></div>
    </div>

    <div id="screen-result" class="overlay hidden">
        <h1 id="result-title">RESULT</h1>
        <p style="font-size: 24px;">SCORE: <span id="result-score">0</span></p>
        <button id="btn-restart">HOMEに戻る</button>
    </div>

    <div id="ui-layer" class="hidden">
        <div class="stats-row">
            <div>Lv. <span id="ui-level">1</span></div>
            <div id="timer">05:00</div>
            <div>SCORE: <span id="ui-score">0</span></div>
        </div>
        <div id="exp-container"><div id="exp-bar"></div></div>
    </div>

    <div id="boss-warning">WARNING: BOSS APPROACHING</div>
    
    <canvas id="gameCanvas"></canvas>

    <script>
        /**
         * ゲーム定数と初期化
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const stageSelect = document.getElementById('stage-select');
        const skillContainer = document.getElementById('skill-container');
        const bossWarning = document.getElementById('boss-warning');

        // ステージ30まで作成
        for(let i=1; i<=30; i++) {
            const opt = document.createElement('option');
            opt.value = i; opt.innerText = `STAGE ${i}`;
            stageSelect.appendChild(opt);
        }

        let width, height;
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // 状態変数
        let state = 'HOME'; // HOME, PLAYING, LEVELUP, RESULT
        let playTime = 300; // 5分
        let score = 0;
        let frameCount = 0;
        let isBossTime = false;
        let currentStage = 1;

        // エンティティ
        let player, enemies, bullets, gems, orbits, damageTexts;
        let targetPos = { x: 0, y: 0 };

        /**
         * スキル定義
         */
        const skillPool = [
            { id: 'multi', name: 'マルチショット', desc: '同時に発射する弾が増える' },
            { id: 'power', name: 'パワーアップ', desc: '弾とバリアのダメージが増加' },
            { id: 'orbit', name: 'オービット', desc: '周囲を回転する防御魔法を追加' },
            { id: 'speed', name: 'スピードアップ', desc: '移動速度が上昇' },
            { id: 'magnet', name: 'マグネット', desc: 'ジェムを拾う範囲が広がる' },
            { id: 'heal', name: 'ヒール', desc: 'HPを最大値の50%回復' }
        ];

        /**
         * ゲーム開始処理
         */
        function initGame() {
            currentStage = parseInt(stageSelect.value);
            player = {
                x: width/2, y: height/2, size: 16,
                hp: 100, maxHp: 100, level: 1, exp: 0, maxExp: 5,
                stats: { multi: 1, power: 12, speed: 3.5, orbit: 0, magnet: 100 }
            };
            enemies = []; bullets = []; gems = []; orbits = []; damageTexts = [];
            score = 0; playTime = 300; frameCount = 0; isBossTime = false;
            targetPos = { x: width/2, y: height/2 };

            state = 'PLAYING';
            hideAllScreens();
            document.getElementById('ui-layer').classList.remove('hidden');
            document.getElementById('ui-level').innerText = "1";
            bossWarning.style.display = 'none';

            gameLoop();
        }

        /**
         * レベルアップ処理（曲線と選択）
         */
        function checkLevelUp() {
            if (player.exp >= player.maxExp) {
                state = 'LEVELUP';
                player.level++;
                player.exp -= player.maxExp;
                // レベルアップ曲線：レベルの1.8乗で必要経験値が増加
                player.maxExp = Math.floor(5 + Math.pow(player.level, 1.8) * 3);
                
                document.getElementById('ui-level').innerText = player.level;
                showLevelUpScreen();
            }
        }

        function showLevelUpScreen() {
            document.getElementById('screen-levelup').classList.remove('hidden');
            skillContainer.innerHTML = '';
            // ランダムに3つのスキルを表示
            const choices = [...skillPool].sort(() => Math.random() - 0.5).slice(0, 3);
            
            choices.forEach(skill => {
                const card = document.createElement('div');
                card.className = 'skill-card';
                card.innerHTML = `<div class="skill-name">${skill.name}</div><div class="skill-desc">${skill.desc}</div>`;
                card.onclick = () => {
                    applySkill(skill.id);
                    state = 'PLAYING';
                    document.getElementById('screen-levelup').classList.add('hidden');
                    gameLoop();
                };
                skillContainer.appendChild(card);
            });
        }

        function applySkill(id) {
            if(id === 'multi') player.stats.multi++;
            if(id === 'power') player.stats.power += 6;
            if(id === 'speed') player.stats.speed += 0.5;
            if(id === 'orbit') player.stats.orbit++;
            if(id === 'magnet') player.stats.magnet += 60;
            if(id === 'heal') player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.5);
        }

        /**
         * 敵スポーンロジック
         */
        function spawnEnemy() {
            if (isBossTime) return; // ボス中は雑魚を湧かせない

            let x, y;
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? -50 : width + 50;
                y = Math.random() * height;
            } else {
                x = Math.random() * width;
                y = Math.random() < 0.5 ? -50 : height + 50;
            }

            // ステージ難易度と時間経過による補正
            const timeElapsed = 300 - playTime;
            const diffMult = 1 + (currentStage * 0.15) + (timeElapsed / 60);
            
            enemies.push({
                x, y, size: 14, 
                hp: 20 * diffMult, maxHp: 20 * diffMult, 
                speed: 1 + (timeElapsed / 150),
                isBoss: false
            });
        }

        function spawnBoss() {
            isBossTime = true;
            bossWarning.style.display = 'block';
            setTimeout(() => { bossWarning.style.display = 'none'; }, 3000);
            
            enemies = []; // 雑魚を一掃
            enemies.push({
                x: width/2, y: -100, size: 70,
                hp: 4000 * (1 + currentStage * 0.3),
                maxHp: 4000 * (1 + currentStage * 0.3),
                speed: 1.2,
                isBoss: true
            });
        }

        /**
         * 攻撃ロジック
         */
        function handleShooting() {
            // 攻撃間隔：レベルが上がると少しずつ早くなる
            const fireRate = Math.max(10, 40 - player.level);
            if (frameCount % fireRate === 0 && enemies.length > 0) {
                // 最も近い敵を確実に探す
                let target = null;
                let minDist = Infinity;
                for (let i=0; i<enemies.length; i++) {
                    const d = Math.hypot(player.x - enemies[i].x, player.y - enemies[i].y);
                    if (d < minDist) {
                        minDist = d;
                        target = enemies[i];
                    }
                }

                if (target) {
                    const angle = Math.atan2(target.y - player.y, target.x - player.x);
                    const multi = player.stats.multi;
                    for (let i=0; i<multi; i++) {
                        const spread = (i - (multi-1)/2) * 0.2;
                        bullets.push({
                            x: player.x, y: player.y,
                            vx: Math.cos(angle + spread) * 9,
                            vy: Math.sin(angle + spread) * 9,
                            life: 60, dmg: player.stats.power
                        });
                    }
                }
            }
        }

        /**
         * メイン更新・描画
         */
        function update() {
            if (state !== 'PLAYING') return;
            frameCount++;

            // タイマー
            if (frameCount % 60 === 0) {
                playTime--;
                score += 2;
                if (playTime === 120 && !isBossTime) spawnBoss(); // 残り3分(120秒)でボス
                if (playTime <= 0) endGame(true);
            }

            // プレイヤー移動
            const dx = targetPos.x - player.x;
            const dy = targetPos.y - player.y;
            player.x += dx * 0.08 * (player.stats.speed / 3.5);
            player.y += dy * 0.08 * (player.stats.speed / 3.5);

            // 弾の移動
            for(let i=bullets.length-1; i>=0; i--) {
                const b = bullets[i];
                b.x += b.vx; b.y += b.vy; b.life--;
                if(b.life <= 0) bullets.splice(i, 1);
            }

            // オービットバリアの計算
            orbits = [];
            for(let i=0; i<player.stats.orbit; i++) {
                const angle = (frameCount * 0.08) + (i * Math.PI * 2 / player.stats.orbit);
                orbits.push({ x: player.x + Math.cos(angle)*70, y: player.y + Math.sin(angle)*70, size: 8 });
            }

            // 敵の移動と判定
            // 時間経過とともに湧きを増やす（最後の方は2フレームに1体）
            const spawnInterval = isBossTime ? 9999 : Math.max(2, 35 - Math.floor((300 - playTime) / 5));
            if (frameCount % spawnInterval === 0) spawnEnemy();

            for(let i=enemies.length-1; i>=0; i--) {
                const e = enemies[i];
                const angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;

                // 弾との衝突
                for(let j=bullets.length-1; j>=0; j--) {
                    const b = bullets[j];
                    if (Math.hypot(e.x - b.x, e.y - b.y) < e.size + 6) {
                        e.hp -= b.dmg;
                        damageTexts.push({ x: e.x, y: e.y, text: Math.floor(b.dmg), life: 20 });
                        bullets.splice(j, 1);
                    }
                }

                // オービットバリアとの衝突
                orbits.forEach(o => {
                    if (Math.hypot(e.x - o.x, e.y - o.y) < e.size + o.size && frameCount % 8 === 0) {
                        e.hp -= player.stats.power * 0.8;
                        damageTexts.push({ x: e.x, y: e.y, text: Math.floor(player.stats.power * 0.8), life: 20 });
                    }
                });

                // 死亡判定
                if (e.hp <= 0) {
                    if (e.isBoss) {
                        score += 10000;
                        isBossTime = false;
                        playTime = Math.min(playTime, 30); // ボス撃破後は残り30秒に短縮
                    }
                    gems.push({ x: e.x, y: e.y, val: e.isBoss ? 200 : 1 });
                    enemies.splice(i, 1);
                    score += 20;
                }

                // プレイヤーへのダメージ
                if (Math.hypot(player.x - e.x, player.y - e.y) < player.size + e.size) {
                    player.hp -= 0.4;
                    if (player.hp <= 0) endGame(false);
                }
            }

            // ジェムの磁石回収
            for(let i=gems.length-1; i>=0; i--) {
                const g = gems[i];
                const d = Math.hypot(player.x - g.x, player.y - g.y);
                if (d < player.stats.magnet) {
                    const a = Math.atan2(player.y - g.y, player.x - g.x);
                    g.x += Math.cos(a) * 12;
                    g.y += Math.sin(a) * 12;
                }
                if (d < player.size + 10) {
                    player.exp += g.val;
                    gems.splice(i, 1);
                    checkLevelUp();
                }
            }

            // テキストポップアップ
            for(let i=damageTexts.length-1; i>=0; i--) {
                damageTexts[i].y -= 1;
                damageTexts[i].life--;
                if(damageTexts[i].life <= 0) damageTexts.splice(i, 1);
            }

            handleShooting();
            updateUI();
        }

        function draw() {
            if (state === 'HOME' || state === 'RESULT') return;
            ctx.fillStyle = "rgba(10, 10, 25, 0.4)"; // 軌跡を残す
            ctx.fillRect(0, 0, width, height);

            // ジェム
            ctx.fillStyle = "#00ff88";
            gems.forEach(g => { ctx.beginPath(); ctx.arc(g.x, g.y, 4, 0, Math.PI*2); ctx.fill(); });

            // 弾
            ctx.fillStyle = "#ffff00";
            bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill(); });

            // バリア
            ctx.fillStyle = "#00ccff";
            orbits.forEach(o => { ctx.beginPath(); ctx.arc(o.x, o.y, o.size, 0, Math.PI*2); ctx.fill(); });

            // 敵
            enemies.forEach(e => {
                ctx.fillStyle = e.isBoss ? "#ff00ff" : "#ff4444";
                ctx.fillRect(e.x - e.size, e.y - e.size, e.size * 2, e.size * 2);
                // HPバー
                ctx.fillStyle = "#300"; ctx.fillRect(e.x - e.size, e.y - e.size - 10, e.size * 2, 4);
                ctx.fillStyle = "#f00"; ctx.fillRect(e.x - e.size, e.y - e.size - 10, (e.size * 2) * (e.hp / e.maxHp), 4);
            });

            // プレイヤー
            ctx.fillStyle = "#0099ff";
            ctx.beginPath(); ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "white"; ctx.lineWidth = 2; ctx.stroke();

            // プレイヤーHPバー
            ctx.fillStyle = "#400"; ctx.fillRect(player.x - 20, player.y + 25, 40, 6);
            ctx.fillStyle = "#0f0"; ctx.fillRect(player.x - 20, player.y + 25, 40 * (player.hp / player.maxHp), 6);

            // ダメージ表示
            ctx.fillStyle = "white"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
            damageTexts.forEach(d => { ctx.globalAlpha = d.life/20; ctx.fillText(d.text, d.x, d.y); });
            ctx.globalAlpha = 1;
        }

        function updateUI() {
            const m = Math.floor(playTime / 60);
            const s = playTime % 60;
            document.getElementById('timer').innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            document.getElementById('ui-score').innerText = score;
            document.getElementById('exp-bar').style.width = (player.exp / player.maxExp * 100) + "%";
        }

        function endGame(win) {
            state = 'RESULT';
            document.getElementById('screen-result').classList.remove('hidden');
            document.getElementById('result-title').innerText = win ? "SURVIVED!" : "DEFEATED";
            document.getElementById('result-title').style.color = win ? "#00ff00" : "#ff0000";
            document.getElementById('result-score').innerText = score;
        }

        function hideAllScreens() {
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-levelup').classList.add('hidden');
            document.getElementById('screen-result').classList.add('hidden');
        }

        function gameLoop() {
            if (state === 'PLAYING') {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }
        }

        // 入力イベント
        const handleMove = (e) => {
            const pos = e.touches ? e.touches[0] : e;
            targetPos.x = pos.clientX;
            targetPos.y = pos.clientY;
        };
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', handleMove);

        document.getElementById('btn-start').onclick = initGame;
        document.getElementById('btn-restart').onclick = () => {
            state = 'HOME';
            hideAllScreens();
            document.getElementById('screen-home').classList.remove('hidden');
            document.getElementById('ui-layer').classList.add('hidden');
            ctx.clearRect(0,0,width,height);
        };

    </script>
</body>
</html>
