<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>JS Survivor</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 1px 1px 2px black; pointer-events: none; }
        #level-text { font-size: 24px; font-weight: bold; color: #ffcc00; }
        #exp-bar-bg { width: 200px; height: 10px; background: #555; border-radius: 5px; margin-top: 5px; border: 1px solid #000; }
        #exp-bar { width: 0%; height: 100%; background: #00ff00; border-radius: 5px; transition: width 0.2s; }
        #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: red; font-size: 40px; font-weight: bold; text-align: center; display: none; cursor: pointer; text-shadow: 2px 2px 0 #000; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="level-text">Lv. 1</div>
        <div>TIME: <span id="time">0</span>s | SCORE: <span id="score">0</span></div>
        <div id="exp-bar-bg"><div id="exp-bar"></div></div>
    </div>
    <div id="msg">GAME OVER<br><span style="font-size:20px; color:white;">画面をタップしてリトライ</span></div>
    
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // リサイズ処理
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // ゲームステータス
        let isGameOver = false;
        let frameCount = 0;
        let score = 0;
        let playTime = 0;

        // 入力処理（マウスポインタ・タッチ位置を追従）
        let targetPos = { x: width / 2, y: height / 2 };
        function updateTarget(e) {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            targetPos.x = clientX;
            targetPos.y = clientY;
        }
        window.addEventListener('mousemove', updateTarget);
        window.addEventListener('touchmove', updateTarget);
        document.getElementById('msg').addEventListener('click', () => location.reload());
        window.addEventListener('touchend', (e) => { if(isGameOver) location.reload(); });

        // エンティティ群
        let player = { x: width / 2, y: height / 2, size: 15, speed: 3, hp: 100, maxHp: 100, level: 1, exp: 0, maxExp: 10, multiShot: 1 };
        let enemies = [];
        let bullets = [];
        let gems = [];
        let damageTexts = [];

        // ユーティリティ：2点間の距離
        function getDist(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); }

        // オブジェクト生成
        function spawnEnemy() {
            // 画面外からスポーン
            let x, y;
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? -30 : width + 30;
                y = Math.random() * height;
            } else {
                x = Math.random() * width;
                y = Math.random() < 0.5 ? -30 : height + 30;
            }
            // 時間経過で敵が硬く、速くなる
            const hp = 20 + Math.floor(playTime / 10) * 10;
            const speed = 1 + Math.random() * 0.5 + (playTime / 100);
            enemies.push({ x, y, size: 12, hp, maxHp: hp, speed });
        }

        function shoot() {
            if (enemies.length === 0) return;
            // 最も近い敵を探す
            let target = enemies.reduce((closest, e) => getDist(player, e) < getDist(player, closest) ? e : closest, enemies[0]);
            
            const angleToTarget = Math.atan2(target.y - player.y, target.x - player.x);
            
            // レベルに応じて弾が扇状に増える
            for (let i = 0; i < player.multiShot; i++) {
                // 複数弾の場合の角度計算（少しずつずらす）
                let spread = (player.multiShot - 1) * 0.2;
                let angle = angleToTarget - (spread / 2) + (i * 0.2);
                if (player.multiShot === 1) angle = angleToTarget;

                bullets.push({
                    x: player.x, y: player.y,
                    vx: Math.cos(angle) * 8, vy: Math.sin(angle) * 8,
                    life: 60, size: 5, damage: 15 + player.level * 2
                });
            }
        }

        function levelUp() {
            player.level++;
            player.exp -= player.maxExp;
            player.maxExp = Math.floor(player.maxExp * 1.5);
            player.hp = player.maxHp; // HP全回復
            // 3レベルごとに弾の数が増える
            if (player.level % 3 === 0) player.multiShot++;
            
            document.getElementById('level-text').innerText = `Lv. ${player.level}`;
            damageTexts.push({ x: player.x, y: player.y - 20, text: "LEVEL UP!", life: 60, color: "#00ffff" });
        }

        // メインループ
        function update() {
            if (isGameOver) return;
            frameCount++;
            if (frameCount % 60 === 0) playTime++;

            // プレイヤーの移動（ターゲットに滑らかに近づく）
            player.x += (targetPos.x - player.x) * 0.05;
            player.y += (targetPos.y - player.y) * 0.05;
            // 画面外に出ないように制限
            player.x = Math.max(player.size, Math.min(width - player.size, player.x));
            player.y = Math.max(player.size, Math.min(height - player.size, player.y));

            // 自動射撃（レベルが上がると少し発射間隔が短くなる）
            let fireRate = Math.max(10, 40 - Math.floor(player.level / 2));
            if (frameCount % fireRate === 0) shoot();

            // 敵のスポーン（時間経過で湧きが激しくなる）
            let spawnRate = Math.max(5, 40 - Math.floor(playTime / 5));
            if (frameCount % spawnRate === 0) spawnEnemy();

            // 弾の更新
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                b.life--;
                if (b.life <= 0 || b.x < 0 || b.x > width || b.y < 0 || b.y > height) {
                    bullets.splice(i, 1);
                }
            }

            // 敵の更新と当たり判定
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                // プレイヤーへ向かって移動
                let angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;

                // 弾との当たり判定
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (getDist(e, b) < e.size + b.size) {
                        e.hp -= b.damage;
                        bullets.splice(j, 1);
                        damageTexts.push({ x: e.x, y: e.y - 10, text: b.damage, life: 30, color: "white" });
                        
                        if (e.hp <= 0) {
                            // 死亡時にジェム（経験値）を落とす
                            gems.push({ x: e.x, y: e.y, size: 4 });
                            enemies.splice(i, 1);
                            score += 10;
                            break;
                        }
                    }
                }

                // プレイヤーとの当たり判定（ダメージ）
                if (enemies[i] && getDist(player, e) < player.size + e.size) {
                    player.hp -= 1;
                    if (player.hp <= 0) {
                        isGameOver = true;
                        document.getElementById('msg').style.display = 'block';
                    }
                }
            }

            // ジェムの収集（近づくと吸い込まれる）
            let magnetRange = 100 + player.level * 5; // レベルアップで回収範囲拡大
            for (let i = gems.length - 1; i >= 0; i--) {
                let g = gems[i];
                let dist = getDist(player, g);
                if (dist < magnetRange) {
                    let angle = Math.atan2(player.y - g.y, player.x - g.x);
                    g.x += Math.cos(angle) * 8;
                    g.y += Math.sin(angle) * 8;
                }
                if (dist < player.size + g.size) {
                    player.exp += 1;
                    gems.splice(i, 1);
                    if (player.exp >= player.maxExp) levelUp();
                }
            }

            // UI更新
            document.getElementById('time').innerText = playTime;
            document.getElementById('score').innerText = score;
            document.getElementById('exp-bar').style.width = `${(player.exp / player.maxExp) * 100}%`;
            
            // ダメージテキストの更新
            for (let i = damageTexts.length - 1; i >= 0; i--) {
                damageTexts[i].y -= 1;
                damageTexts[i].life--;
                if (damageTexts[i].life <= 0) damageTexts.splice(i, 1);
            }
        }

        // 描画
        function draw() {
            // 背景クリア（少し残像を残す）
            ctx.fillStyle = "rgba(34, 34, 34, 0.4)";
            ctx.fillRect(0, 0, width, height);

            // ジェム（緑）
            ctx.fillStyle = "#00ff00";
            gems.forEach(g => {
                ctx.beginPath();
                ctx.arc(g.x, g.y, g.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // 敵（赤の四角）
            enemies.forEach(e => {
                ctx.fillStyle = "#ff3333";
                ctx.fillRect(e.x - e.size, e.y - e.size, e.size * 2, e.size * 2);
                // 敵のHPバー
                ctx.fillStyle = "black";
                ctx.fillRect(e.x - e.size, e.y - e.size - 6, e.size * 2, 4);
                ctx.fillStyle = "red";
                ctx.fillRect(e.x - e.size, e.y - e.size - 6, (e.size * 2) * (e.hp / e.maxHp), 4);
            });

            // 弾（黄色）
            ctx.fillStyle = "#ffff00";
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // プレイヤー（青い円）
            ctx.fillStyle = "#3399ff";
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "white";
            ctx.lineWidth = 2;
            ctx.stroke();

            // プレイヤーのHPバー（足元）
            ctx.fillStyle = "red";
            ctx.fillRect(player.x - 20, player.y + 20, 40, 5);
            ctx.fillStyle = "#00ff00";
            ctx.fillRect(player.x - 20, player.y + 20, 40 * (player.hp / player.maxHp), 5);

            // テキストポップアップ
            ctx.font = "bold 16px sans-serif";
            ctx.textAlign = "center";
            damageTexts.forEach(dt => {
                ctx.fillStyle = dt.color;
                ctx.globalAlpha = dt.life / 30; // フェードアウト
                ctx.fillText(dt.text, dt.x, dt.y);
            });
            ctx.globalAlpha = 1.0;
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ゲーム開始
        gameLoop();
    </script>
</body>
</html>
