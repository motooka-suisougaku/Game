<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>JS SURVIVOR - ONLINE & AWAKENING</title>
    <style>
        body { margin:0; overflow:hidden; background:#050510; font-family:sans-serif; touch-action:none; color:white; user-select:none; }
        canvas { display:block; }
        .overlay { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; background:rgba(0,0,0,0.9); z-index:20; text-align:center;}
        .hidden { display:none !important; }
        h1 { font-size:42px; color:#ffcc00; text-shadow:0 0 20px #ffcc00; margin-bottom:10px; }
        button, select, input { font-size:18px; padding:12px 20px; margin:5px; border-radius:8px; background:#1a1a2e; color:white; border:2px solid #444; cursor:pointer; }
        button:hover { border-color:#00ffcc; background:#2a2a4e; }
        .stats-row { display:flex; gap:15px; margin-bottom:10px; }
        
        /* UI */
        #ui-layer { position:absolute; top:0; left:0; width:100%; padding:10px; pointer-events:none; z-index:10; }
        .top-bar { display:flex; justify-content:space-between; font-weight:bold; font-size:20px; text-shadow:2px 2px 0 #000; }
        #exp-bg { width:100%; height:10px; background:#222; border:1px solid #444; margin-top:5px; }
        #exp-bar { width:0%; height:100%; background:#00ffcc; transition:width 0.2s; }

        /* Char Grid */
        .grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; max-height:40vh; overflow-y:auto; padding:10px; border:1px solid #333; }
        .box { border:2px solid #444; padding:8px; cursor:pointer; background:#111; font-size:13px; }
        .box.owned { border-color:#00ffcc; }
        .box.selected { background:#00ffcc; color:#000; font-weight:bold; }
        .box.awakened { border-color:#ff00ff; box-shadow:0 0 10px #ff00ff; }

        .skill-card { background:#222; border:2px solid #00ffcc; padding:15px; margin:10px; width:260px; cursor:pointer; }
        #boss-notice { position:absolute; top:20%; width:100%; text-align:center; font-size:50px; color:red; font-weight:bold; display:none; z-index:30; }
    </style>
</head>
<body>

    <div id="screen-login" class="overlay">
        <h1>JS SURVIVOR</h1>
        <input type="text" id="input-name" placeholder="プレイヤー名" maxlength="10">
        <button id="btn-login">クラウド同期して開始</button>
    </div>

    <div id="screen-home" class="overlay hidden">
        <p><span id="user-name" style="color:#0cf; font-size:24px;"></span> の基地</p>
        <p>所持コイン: <span id="user-coins" style="color:#fc0; font-size:24px;">0</span> C</p>
        <div class="stats-row">
            <select id="stage-select"></select>
            <button id="btn-start" style="background:#050; border-color:#0f0;">ソロ出撃</button>
        </div>
        <button id="btn-raid-menu" style="border-color:#f0f; color:#f0f;">オンラインレイド</button>
        <div class="stats-row">
            <button id="btn-gacha-menu">ガチャ(1000C)</button>
            <button id="btn-char-menu">キャラ変更</button>
        </div>
    </div>

    <div id="screen-raid" class="overlay hidden">
        <h2 style="color:#f0f;">RAID MATCHING</h2>
        <p>同じパスワードの人とマッチングします</p>
        <input type="text" id="raid-pass" value="7777" placeholder="パスワード">
        <button id="btn-join-raid">マッチング開始</button>
        <button id="btn-cancel-raid">戻る</button>
        <p id="raid-status" style="margin-top:20px; color:#aaa;">待機中...</p>
    </div>

    <div id="screen-chars" class="overlay hidden">
        <h2>キャラクター選択</h2>
        <div id="char-list" class="grid"></div>
        <button id="btn-home-char">戻る</button>
    </div>

    <div id="screen-gacha" class="overlay hidden">
        <h1>GACHA</h1>
        <button id="btn-pull">1回引く (1000C)</button>
        <p id="gacha-res" style="font-size:24px; min-height:30px;"></p>
        <button id="btn-home-gacha">戻る</button>
    </div>

    <div id="screen-levelup" class="overlay hidden">
        <h2>SKILL UP!</h2>
        <div id="skill-list"></div>
    </div>

    <div id="screen-result" class="overlay hidden">
        <h1 id="res-title">FINISH</h1>
        <p>獲得: <span id="res-coins" style="color:#fc0;">0</span> C</p>
        <div id="awaken-box" class="hidden" style="border:2px solid #f0f; padding:15px; margin:10px;">
            <p style="color:#f0f;">レイドボス撃破！30,000Cで覚醒可能</p>
            <button id="btn-awaken-act">覚醒する (30000C)</button>
        </div>
        <button id="btn-back-home">HOMEへ戻る</button>
    </div>

    <div id="ui-layer" class="hidden">
        <div class="top-bar">
            <div id="ui-lv">Lv.1</div>
            <div id="ui-timer" style="color:#f44;">05:00</div>
            <div id="ui-name">---</div>
        </div>
        <div id="exp-bg"><div id="exp-bar"></div></div>
    </div>

    <div id="boss-notice">WARNING!!</div>
    <canvas id="gameCanvas"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, get, onValue, off } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Firebase設定
        const firebaseConfig = { databaseURL: "https://game-2d503-default-rtdb.firebaseio.com" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ゲーム定数・データ
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        const resize = () => { width=window.innerWidth; height=window.innerHeight; canvas.width=width; canvas.height=height; };
        window.addEventListener('resize', resize); resize();

        let saveData = { name: "", coins: 0, unlocked: 1, chars: [0], selected: 0, awakened: [] };
        
        // 全20キャラデータ (覚醒技 1:巨大貫通, 2:全方位, 3:追尾, 4:極太, 5:超連射)
        const CHARS = [
            { id: 0, name: "ルーキー", color: "#09f", hp: 100, spd: 4.0, atk: 15, awkT: 1 },
            { id: 1, name: "ニンジャ", color: "#333", hp: 65, spd: 5.5, atk: 12, awkT: 5 },
            { id: 2, name: "タンク", color: "#841", hp: 250, spd: 2.5, atk: 20, awkT: 2 },
            { id: 3, name: "スナイパ", color: "#0f0", hp: 80, spd: 3.5, atk: 45, awkT: 4 },
            { id: 4, name: "マグネ", color: "#f0f", hp: 100, spd: 3.8, atk: 12, awkT: 3 },
            { id: 5, name: "パラディン", color: "#fd0", hp: 160, spd: 3.0, atk: 18, awkT: 2 },
            { id: 6, name: "ガンナー", color: "#f40", hp: 90, spd: 4.0, atk: 10, awkT: 5 },
            { id: 7, name: "ヴァンピ", color: "#808", hp: 100, spd: 4.2, atk: 16, awkT: 3 },
            { id: 8, name: "サイボグ", color: "#789", hp: 180, spd: 3.2, atk: 25, awkT: 4 },
            { id: 9, name: "エスパー", color: "#0ff", hp: 75, spd: 4.5, atk: 12, awkT: 3 },
            { id: 10, name: "バサカ", color: "#b22", hp: 130, spd: 4.5, atk: 35, awkT: 1 },
            { id: 11, name: "ゴースト", color: "#ccf", hp: 55, spd: 5.0, atk: 14, awkT: 2 },
            { id: 12, name: "サムライ", color: "#c55", hp: 115, spd: 4.2, atk: 30, awkT: 5 },
            { id: 13, name: "リッチ", color: "#438", hp: 85, spd: 3.8, atk: 22, awkT: 2 },
            { id: 14, name: "ギャンブ", color: "#f19", hp: 100, spd: 4.0, atk: 8, awkT: 5 },
            { id: 15, name: "ドクター", color: "#fff", hp: 120, spd: 3.5, atk: 12, awkT: 3 },
            { id: 16, name: "アチャ", color: "#282", hp: 95, spd: 4.3, atk: 24, awkT: 5 },
            { id: 17, name: "エイリ", color: "#7f0", hp: 100, spd: 4.8, atk: 18, awkT: 4 },
            { id: 18, name: "ドラゴン", color: "#d13", hp: 220, spd: 3.8, atk: 35, awkT: 1 },
            { id: 19, name: "カミサマ", color: "#fe0", hp: 999, spd: 6.0, atk: 99, awkT: 2 }
        ];

        // --- ゲーム状態管理 ---
        let state = 'LOGIN', mode = 'NORMAL', playTime = 300, frame = 0, coins = 0;
        let p, enemies=[], bullets=[], gems=[], texts=[], orbits=[], hazards=[];
        let targetPos = { x: 0, y: 0 }, isBoss = false, bossDone = false;

        // --- Firebase同期 ---
        async function cloudSave() { if(saveData.name) set(ref(db, 'users/'+saveData.name), saveData); }
        async function cloudLoad(name) {
            const snap = await get(ref(db, 'users/'+name));
            if(snap.exists()) { saveData = snap.val(); if(!saveData.awakened) saveData.awakened=[]; return true; }
            return false;
        }

        // --- UIアクション ---
        document.getElementById('btn-login').onclick = async () => {
            const n = document.getElementById('input-name').value.trim();
            if(!n) return;
            if(!await cloudLoad(n)) { saveData.name = n; await cloudSave(); }
            goHome();
        };

        function goHome() {
            state = 'HOME';
            document.getElementById('user-name').innerText = saveData.name;
            document.getElementById('user-coins').innerText = saveData.coins;
            const sel = document.getElementById('stage-select'); sel.innerHTML = "";
            for(let i=1; i<=30; i++) {
                let o = document.createElement('option'); o.value=i; o.innerText=`Stage ${i}`;
                if(i > saveData.unlocked) o.disabled=true;
                sel.appendChild(o);
            }
            sel.value = Math.min(saveData.unlocked, 30);
            hideAll(); document.getElementById('screen-home').classList.remove('hidden');
        }

        document.getElementById('btn-char-menu').onclick = () => {
            hideAll(); document.getElementById('screen-chars').classList.remove('hidden');
            const list = document.getElementById('char-list'); list.innerHTML = "";
            CHARS.forEach(c => {
                const isO = saveData.chars.includes(c.id); const isA = saveData.awakened.includes(c.id);
                const div = document.createElement('div');
                div.className = `box ${isO?'owned':''} ${saveData.selected===c.id?'selected':''} ${isA?'awakened':''}`;
                div.innerHTML = `<strong>${isO?c.name:'???'}</strong><br>${isA?'★AWK':''}`;
                if(isO) div.onclick = () => { saveData.selected=c.id; cloudSave(); document.getElementById('btn-char-menu').click(); };
                list.appendChild(div);
            });
        };

        document.getElementById('btn-gacha-menu').onclick = () => {
            hideAll(); document.getElementById('screen-gacha').classList.remove('hidden');
            document.getElementById('gacha-res').innerText = "";
        };

        document.getElementById('btn-pull').onclick = () => {
            if(saveData.coins < 1000) return alert("コイン不足");
            saveData.coins -= 1000;
            const id = Math.random()<0.01 ? 19 : Math.floor(Math.random()*19);
            const r = document.getElementById('gacha-res');
            if(saveData.chars.includes(id)) { r.innerText=`${CHARS[id].name} (ダブリ +300C)`; saveData.coins+=300; r.style.color="#aaa"; }
            else { r.innerText=`NEW: ${CHARS[id].name}!!`; saveData.chars.push(id); r.style.color="#0ff"; }
            cloudSave(); document.getElementById('user-coins').innerText = saveData.coins;
        };

        // レイドマッチング
        document.getElementById('btn-raid-menu').onclick = () => { hideAll(); document.getElementById('screen-raid').classList.remove('hidden'); };
        document.getElementById('btn-join-raid').onclick = () => {
            const pass = document.getElementById('raid-pass').value;
            const rRef = ref(db, 'rooms/'+pass);
            document.getElementById('raid-status').innerText = "マッチング中...";
            get(rRef).then(snap => {
                if(!snap.exists()) {
                    set(rRef, { host: saveData.name, status: "wait" });
                    onValue(rRef, s => { if(s.val()?.status === "start") initGame('RAID'); });
                } else {
                    set(ref(db, `rooms/${pass}/status`), "start");
                }
            });
        };

        // --- ゲームエンジン ---
        function initGame(m) {
            mode = m; frame = 0; playTime = 300; coins = 0; isBoss = false; bossDone = false;
            const c = CHARS[saveData.selected];
            p = { 
                x: width/2, y: height/2, size: 15, hp: c.hp, max: c.hp, lv: 1, exp: 0, next: 5, color: c.color, cid: c.id, awkT: c.awkT,
                multi: 1, power: c.atk, spd: c.spd, orbit: 0, mag: 120, awake: saveData.awakened.includes(c.id)
            };
            enemies=[]; bullets=[]; gems=[]; orbits=[]; texts=[]; hazards=[];
            targetPos = { x: p.x, y: p.y }; 
            state = 'PLAYING';
            hideAll(); document.getElementById('ui-layer').classList.remove('hidden');
            document.getElementById('ui-name').innerText = c.name + (p.awake?"★":"");
            loop();
        }

        function fireAwk(x, y, t, dmg, isE) {
            const col = isE ? "#f00" : "#f0f";
            if(t===1){ bullets.push({x,y,vx:Math.cos(frame/10)*8, vy:Math.sin(frame/10)*8, life:100, dmg:dmg*3, isE, sz:25, col, pierce:true}); }
            if(t===2){ for(let i=0;i<12;i++){ let a=i*Math.PI/6; bullets.push({x,y,vx:Math.cos(a)*6, vy:Math.sin(a)*6, life:80, dmg:dmg, isE, sz:10, col}); }}
            if(t===3){ bullets.push({x,y,vx:0, vy:0, life:150, dmg:dmg*2, isE, sz:15, col, track:true}); }
            if(t===4){ let a = isE?Math.atan2(p.y-y, p.x-x):Math.random()*6; bullets.push({x,y,vx:Math.cos(a)*20, vy:Math.sin(a)*20, life:40, dmg:dmg*5, isE, sz:10, col, pierce:true}); }
            if(t===5){ for(let i=0;i<5;i++){ bullets.push({x,y,vx:Math.cos(frame+i)*12, vy:Math.sin(frame+i)*12, life:60, dmg:dmg, isE, sz:6, col}); }}
        }

        function update() {
            if(state !== 'PLAYING') return;
            frame++;
            if(frame % 60 === 0) { 
                playTime--; coins+=2; 
                if(mode==='NORMAL' && playTime===180) spawnBoss(); 
                if(playTime<=0) finish(true);
            }

            // 移動 (スキル選択中は動かないよう制御済み)
            p.x += (targetPos.x - p.x) * 0.1 * (p.spd/4);
            p.y += (targetPos.y - p.y) * 0.1 * (p.spd/4);

            // 攻撃
            if(frame % 15 === 0 && enemies.length > 0) {
                let e = enemies[0]; let a = Math.atan2(e.y-p.y, e.x-p.x);
                for(let i=0; i<p.multi; i++) bullets.push({x:p.x, y:p.y, vx:Math.cos(a+(i-p.multi/2)*0.2)*12, vy:Math.sin(a+(i-p.multi/2)*0.2)*12, life:50, dmg:p.power, isE:false, sz:5, col:"#ff0"});
            }
            if(p.awake && frame % 90 === 0) fireAwk(p.x, p.y, p.awkT, p.power, false);

            // 敵生成
            if(!isBoss) {
                let rate = bossDone ? 120 : Math.max(5, 30 - Math.floor((300-playTime)/6));
                if(frame % rate === 0) {
                    let x = Math.random()<0.5 ? -30 : width+30; let y = Math.random()*height;
                    let hp = 10 * (1 + (300-playTime)/60);
                    enemies.push({x,y,sz:12,hp,max:hp,spd:1.5,isB:false,col:"#f44"});
                }
            }

            // 当たり判定
            bullets.forEach((b, i) => {
                b.x += b.vx; b.y += b.vy; b.life--;
                if(b.track && frame%5===0) {
                    let target = b.isE ? p : (enemies[0]||b);
                    let a = Math.atan2(target.y-b.y, target.x-b.x);
                    b.vx += Math.cos(a)*1.5; b.vy += Math.sin(a)*1.5;
                }
                if(b.isE && Math.hypot(p.x-b.x, p.y-b.y) < p.size+b.sz) { p.hp -= b.dmg; if(!b.pierce) b.life=0; if(p.hp<=0) finish(false); }
                if(b.life <= 0) bullets.splice(i,1);
            });

            enemies.forEach((e, i) => {
                let a = Math.atan2(p.y-e.y, p.x-e.x);
                e.x += Math.cos(a)*e.spd; e.y += Math.sin(a)*e.spd;
                if(e.isB) {
                    if(e.raid) {
                        e.inv = playTime > 180; // 2分間無敵
                        if(frame % 100 === 0) fireAwk(e.x, e.y, e.awkT, 25, true);
                    } else if(frame % 80 === 0) {
                        for(let j=0;j<8;j++){ bullets.push({x:e.x,y:e.y,vx:Math.cos(j)*5,vy:Math.sin(j)*5,life:100,dmg:10,isE:true,sz:8,col:"#f0f"}); }
                    }
                }
                bullets.forEach(b => {
                    if(!b.isE && Math.hypot(e.x-b.x, e.y-b.y) < e.sz+b.sz) {
                        let d = e.inv ? 1 : b.dmg; e.hp -= d; texts.push({x:e.x,y:e.y,t:Math.floor(d),l:20}); if(!b.pierce) b.life=0;
                    }
                });
                if(e.hp<=0) {
                    if(e.isB) { isBoss=false; bossDone=true; playTime=Math.min(playTime,30); coins+=e.raid?5000:1000; }
                    gems.push({x:e.x,y:e.y,v:e.isB?100:1}); enemies.splice(i,1); coins+=5;
                }
                if(Math.hypot(p.x-e.x, p.y-e.y) < p.size+e.sz) { p.hp -= e.isB?2:0.5; if(p.hp<=0) finish(false); }
            });

            gems.forEach((g, i) => {
                let d = Math.hypot(p.x-g.x, p.y-g.y);
                if(d < p.mag) { let a = Math.atan2(p.y-g.y, p.x-g.x); g.x+=Math.cos(a)*10; g.y+=Math.sin(a)*10; }
                if(d < 20) { p.exp+=g.v; gems.splice(i,1); if(p.exp>=p.next) lvUp(); }
            });
            texts.forEach((t, i) => { t.y--; t.l--; if(t.l<=0) texts.splice(i,1); });

            // UI反映
            document.getElementById('ui-lv').innerText = `Lv.${p.lv}`;
            document.getElementById('ui-timer').innerText = `${Math.floor(playTime/60)}:${String(playTime%60).padStart(2,'0')}`;
            document.getElementById('exp-bar').style.width = (p.exp/p.next*100) + "%";
        }

        function draw() {
            ctx.fillStyle = "rgba(5,5,15,0.4)"; ctx.fillRect(0,0,width,height);
            gems.forEach(g => { ctx.fillStyle="#0f8"; ctx.beginPath(); ctx.arc(g.x,g.y,4,0,7); ctx.fill(); });
            bullets.forEach(b => { ctx.fillStyle=b.col; ctx.beginPath(); ctx.arc(b.x,b.y,b.sz,0,7); ctx.fill(); });
            enemies.forEach(e => {
                ctx.fillStyle = e.inv ? "#555" : e.col; ctx.beginPath(); ctx.arc(e.x,e.y,e.sz,0,7); ctx.fill();
                ctx.fillStyle="red"; ctx.fillRect(e.x-e.sz, e.y-e.sz-10, e.sz*2*(e.hp/e.max), 5);
                if(e.isB) { ctx.fillStyle="#fff"; ctx.fillText(e.inv?"INVINCIBLE":"BOSS", e.x-20, e.y+e.sz+15); }
            });
            ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill();
            ctx.strokeStyle = p.awake?"#f0f":"#fff"; ctx.lineWidth=3; ctx.stroke();
            ctx.fillStyle="red"; ctx.fillRect(p.x-20, p.y+20, 40, 5); ctx.fillStyle="#0f0"; ctx.fillRect(p.x-20, p.y+20, 40*(p.hp/p.max), 5);
            ctx.fillStyle="#fff"; texts.forEach(t => { ctx.globalAlpha=t.l/20; ctx.fillText(t.t, t.x, t.y); }); ctx.globalAlpha=1;
        }

        function spawnBoss() {
            isBoss=true; enemies=[]; 
            let stage = parseInt(document.getElementById('stage-select').value);
            let hp = 5000 * (1 + stage*0.5);
            enemies.push({x:width/2, y:-100, sz:80, hp, max:hp, spd:1, isB:true, raid:false, col:"#800"});
            notice("BOSS APPEARED!");
        }

        async function spawnRaidBoss() {
            isBoss=true; enemies=[];
            const c = CHARS[saveData.selected];
            enemies.push({x:width/2, y:-100, sz:p.size*3, hp:50000, max:50000, spd:1.5, isB:true, raid:true, awkT:c.awkT, col:c.color});
            notice("RAID BOSS: 2MIN DEFENSE!");
        }

        function lvUp() {
            state='LVUP'; targetPos = {x:p.x, y:p.y};
            p.lv++; p.exp=0; p.next = Math.floor(p.next*1.4);
            document.getElementById('screen-levelup').classList.remove('hidden');
            const list = document.getElementById('skill-list'); list.innerHTML="";
            const pool = [
                {n:"連射", f:()=>{p.multi++}}, {n:"威力", f:()=>{p.power+=10}}, 
                {n:"磁石", f:()=>{p.mag+=60}}, {n:"速度", f:()=>{p.spd+=0.5}},
                {n:"回復", f:()=>{p.hp=p.max}}
            ];
            pool.sort(()=>Math.random()-0.5).slice(0,3).forEach(s => {
                let d = document.createElement('div'); d.className="skill-card"; d.innerText=s.n;
                d.onclick=()=>{ s.f(); state='PLAYING'; document.getElementById('screen-levelup').classList.add('hidden'); loop(); };
                list.appendChild(d);
            });
        }

        function finish(win) {
            state='RESULT'; 
            if(win && mode==='NORMAL' && saveData.unlocked == parseInt(document.getElementById('stage-select').value)) saveData.unlocked++;
            saveData.coins += coins; cloudSave();
            hideAll(); document.getElementById('screen-result').classList.remove('hidden');
            document.getElementById('res-title').innerText = win ? "CLEAR!" : "GAME OVER";
            document.getElementById('res-coins').innerText = coins;
            if(win && mode==='RAID' && !p.awake) document.getElementById('awaken-box').classList.remove('hidden');
            else document.getElementById('awaken-box').classList.add('hidden');
        }

        document.getElementById('btn-awaken-act').onclick = () => {
            if(saveData.coins < 30000) return alert("コイン不足");
            saveData.coins -= 30000; saveData.awakened.push(p.cid); cloudSave();
            alert("覚醒完了！"); document.getElementById('awaken-box').classList.add('hidden');
        };

        function loop() { if(state==='PLAYING'){ update(); draw(); requestAnimationFrame(loop); } }
        function hideAll() { document.querySelectorAll('.overlay, #ui-layer').forEach(e=>e.classList.add('hidden')); }
        function notice(t) { const n=document.getElementById('boss-notice'); n.innerText=t; n.style.display='block'; setTimeout(()=>n.style.display='none',3000); }

        window.addEventListener('mousemove', e=>{ if(state==='PLAYING') {targetPos.x=e.clientX; targetPos.y=e.clientY;} });
        window.addEventListener('touchmove', e=>{ if(state==='PLAYING') {targetPos.x=e.touches[0].clientX; targetPos.y=e.touches[0].clientY;} });
        document.getElementById('btn-start').onclick = () => initGame('NORMAL');
        document.getElementById('btn-home-char').onclick = goHome;
        document.getElementById('btn-home-gacha').onclick = goHome;
        document.getElementById('btn-back-home').onclick = goHome;
        document.getElementById('btn-cancel-raid').onclick = goHome;

    </script>
</body>
</html>
