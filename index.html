<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>JS Survivor - Boss Update</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: sans-serif; touch-action: none; color: white; user-select: none; }
        canvas { display: block; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); z-index: 10; }
        .hidden { display: none !important; }
        h1 { font-size: 42px; color: #ffcc00; text-shadow: 0 0 10px #ffcc00; }
        select, button { font-size: 18px; padding: 10px 20px; margin: 10px; border-radius: 8px; background: #222; color: white; border: 2px solid #555; cursor: pointer; }
        #ui { position: absolute; top: 10px; left: 10px; width: calc(100% - 20px); z-index: 5; pointer-events: none; }
        .ui-stats { display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; }
        #timer { font-size: 24px; color: #ff5555; }
        #exp-bar-bg { width: 100%; height: 10px; background: #333; margin-top: 10px; border-radius: 5px; border: 1px solid #000; overflow: hidden; }
        #exp-bar { width: 0%; height: 100%; background: #00ff00; transition: width 0.1s; }
        .skill-card { background: #333; border: 2px solid #444; border-radius: 10px; padding: 15px; margin: 10px; width: 250px; cursor: pointer; text-align: center; }
        .skill-card:hover { border-color: #00ffff; background: #444; }
        #boss-alert { position: absolute; top: 20%; width: 100%; text-align: center; color: red; font-size: 40px; font-weight: bold; display: none; text-shadow: 2px 2px 0 #000; z-index: 8; }
    </style>
</head>
<body>

    <div id="screen-home" class="screen">
        <h1>JS SURVIVOR</h1>
        <select id="stage-select"></select>
        <button id="btn-start">STAGE START</button>
    </div>

    <div id="screen-levelup" class="screen hidden">
        <h2 style="color: #00ffff;">SKILL UP!</h2>
        <div id="skill-container"></div>
    </div>

    <div id="screen-result" class="screen hidden">
        <h1 id="result-title">RESULT</h1>
        <p>SCORE: <span id="result-score">0</span></p>
        <button id="btn-home">HOME</button>
    </div>

    <div id="ui" class="hidden">
        <div class="ui-stats">
            <div>Lv. <span id="ui-level">1</span></div>
            <div id="timer">05:00</div>
            <div>SCORE: <span id="ui-score">0</span></div>
        </div>
        <div id="exp-bar-bg"><div id="exp-bar"></div></div>
    </div>

    <div id="boss-alert">BOSS APPEARED!!</div>
    
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        const screens = { home: document.getElementById('screen-home'), levelup: document.getElementById('screen-levelup'), result: document.getElementById('screen-result'), ui: document.getElementById('ui') };
        const stageSelect = document.getElementById('stage-select');
        const skillContainer = document.getElementById('skill-container');
        const bossAlert = document.getElementById('boss-alert');

        for(let i=1; i<=30; i++) {
            let opt = document.createElement('option');
            opt.value = i; opt.innerText = `STAGE ${i}`;
            stageSelect.appendChild(opt);
        }

        function resize() {
            width = window.innerWidth; height = window.innerHeight;
            canvas.width = width; canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        let state = 'HOME', frameCount = 0, playTime = 300, score = 0, currentStage = 1, isBossTime = false;
        let player, enemies, bullets, gems, damageTexts, orbits;
        let targetPos = { x: 0, y: 0 };

        const skillPool = [
            { id: 'multi', name: 'マルチショット', desc: '弾数+1' },
            { id: 'power', name: 'パワー', desc: 'ダメージ+5' },
            { id: 'speed', name: 'スピード', desc: '移動速度UP' },
            { id: 'orbit', name: 'オービット', desc: '回転バリア追加' },
            { id: 'magnet', name: 'マグネット', desc: '回収範囲UP' },
            { id: 'heal', name: 'ヒール', desc: 'HP回復' }
        ];

        function handleInput(e) {
            const c = e.touches ? e.touches[0] : e;
            targetPos.x = c.clientX; targetPos.y = c.clientY;
        }
        window.addEventListener('mousemove', handleInput);
        window.addEventListener('touchmove', handleInput);

        function initGame() {
            currentStage = parseInt(stageSelect.value);
            player = { 
                x: width/2, y: height/2, size: 15, hp: 100, maxHp: 100, level: 1, exp: 0, maxExp: 5, // 最初は5でレベルアップ
                stats: { multi: 1, power: 10, speed: 3.5, orbit: 0, magnet: 100 }
            };
            enemies = []; bullets = []; gems = []; damageTexts = []; orbits = [];
            score = 0; playTime = 300; frameCount = 0; isBossTime = false;
            targetPos = { x: width/2, y: height/2 };
            state = 'PLAYING';
            bossAlert.style.display = 'none';
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            screens.ui.classList.remove('hidden');
            loop();
        }

        function triggerLevelUp() {
            state = 'LEVELUP';
            player.level++;
            player.exp -= player.maxExp;
            // レベルアップ曲線：低レベルは早く、高レベルは遅く
            player.maxExp = Math.floor(5 + Math.pow(player.level, 1.8) * 3);
            
            document.getElementById('ui-level').innerText = player.level;
            skillContainer.innerHTML = '';
            [...skillPool].sort(() => 0.5 - Math.random()).slice(0, 3).forEach(s => {
                let div = document.createElement('div');
                div.className = 'skill-card';
                div.innerHTML = `<strong>${s.name}</strong><p>${s.desc}</p>`;
                div.onclick = () => {
                    if(s.id === 'multi') player.stats.multi++;
                    if(s.id === 'power') player.stats.power += 5;
                    if(s.id === 'speed') player.stats.speed += 0.4;
                    if(s.id === 'orbit') player.stats.orbit++;
                    if(s.id === 'magnet') player.stats.magnet += 50;
                    if(s.id === 'heal') player.hp = Math.min(player.maxHp, player.hp + 50);
                    state = 'PLAYING';
                    screens.levelup.classList.add('hidden');
                    loop();
                };
                skillContainer.appendChild(div);
            });
            screens.levelup.classList.remove('hidden');
        }

        function spawnBoss() {
            isBossTime = true;
            bossAlert.style.display = 'block';
            setTimeout(() => bossAlert.style.display = 'none', 3000);
            enemies = []; // 雑魚を一掃
            enemies.push({ 
                x: width/2, y: -100, size: 60, hp: 5000 * (1 + currentStage*0.2), 
                maxHp: 5000 * (1 + currentStage*0.2), speed: 1.2, isBoss: true 
            });
        }

        function spawnEnemy() {
            if(isBossTime) return; // ボス中は雑魚が出ない
            let x, y;
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? -30 : width + 30; y = Math.random() * height;
            } else {
                x = Math.random() * width; y = Math.random() < 0.5 ? -30 : height + 30;
            }
            let difficulty = (300 - playTime) / 60; // 0〜5
            enemies.push({ x, y, size: 12, hp: 20 + difficulty * 15, maxHp: 20 + difficulty * 15, speed: 1 + difficulty * 0.2, isBoss: false });
        }

        function update() {
            if(state !== 'PLAYING') return;
            frameCount++;
            if(frameCount % 60 === 0) {
                playTime--;
                // 3分経過（残り120秒）でボス出現
                if(playTime === 120 && !isBossTime) spawnBoss();
                if(playTime <= 0) end(true);
            }

            // プレイヤー移動
            player.x += (targetPos.x - player.x) * 0.06 * (player.stats.speed/3);
            player.y += (targetPos.y - player.y) * 0.06 * (player.stats.speed/3);

            // 射撃（レベルに応じて間隔短縮）
            if(frameCount % Math.max(10, 40 - player.level) === 0) {
                if(enemies.length > 0) {
                    let target = enemies.reduce((prev, curr) => 
                        Math.hypot(player.x-curr.x, player.y-curr.y) < Math.hypot(player.x-prev.x, player.y-prev.y) ? curr : prev);
                    let angle = Math.atan2(target.y - player.y, target.x - player.x);
                    for(let i=0; i<player.stats.multi; i++){
                        let a = angle + (i - (player.stats.multi-1)/2) * 0.2;
                        bullets.push({x: player.x, y: player.y, vx: Math.cos(a)*8, vy: Math.sin(a)*8, life: 60, dmg: player.stats.power});
                    }
                }
            }

            // 敵スポーン率：最初は遅く、最後（ボス前）は激流
            if(!isBossTime) {
                let spawnInterval = Math.max(2, 40 - Math.floor((300 - playTime) / 4));
                if(frameCount % spawnInterval === 0) spawnEnemy();
            }

            // 弾・オービット更新
            orbits = [];
            for(let i=0; i<player.stats.orbit; i++) {
                let a = (frameCount * 0.07) + (i * Math.PI * 2 / player.stats.orbit);
                orbits.push({x: player.x + Math.cos(a)*70, y: player.y + Math.sin(a)*70, size: 8});
            }

            bullets.forEach((b, i) => {
                b.x += b.vx; b.y += b.vy; b.life--;
                if(b.life <= 0) bullets.splice(i, 1);
            });

            // 敵更新
            enemies.forEach((e, i) => {
                let dist = Math.hypot(player.x - e.x, player.y - e.y);
                let angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;

                // 弾ヒット
                bullets.forEach((b, bi) => {
                    if(Math.hypot(e.x-b.x, e.y-b.y) < e.size + b.size) {
                        e.hp -= b.dmg; bullets.splice(bi, 1);
                        damageTexts.push({x: e.x, y: e.y, text: b.dmg, life: 20});
                    }
                });
                // オービットヒット
                orbits.forEach(o => {
                    if(Math.hypot(e.x-o.x, e.y-o.y) < e.size + o.size && frameCount % 10 === 0) {
                        e.hp -= player.stats.power;
                        damageTexts.push({x: e.x, y: e.y, text: player.stats.power, life: 20});
                    }
                });

                if(e.hp <= 0) {
                    if(e.isBoss) { score += 5000; isBossTime = false; playTime = Math.min(playTime, 30); } // ボス倒したら残り30秒に
                    gems.push({x: e.x, y: e.y, val: e.isBoss ? 100 : 1});
                    enemies.splice(i, 1);
                    score += 10;
                }
                if(dist < player.size + e.size) player.hp -= 0.5;
            });

            if(player.hp <= 0) end(false);

            // ジェム
            gems.forEach((g, i) => {
                let dist = Math.hypot(player.x - g.x, player.y - g.y);
                if(dist < player.stats.magnet) {
                    let a = Math.atan2(player.y-g.y, player.x-g.x);
                    g.x += Math.cos(a)*10; g.y += Math.sin(a)*10;
                }
                if(dist < player.size + 10) {
                    player.exp += g.val; gems.splice(i, 1);
                    if(player.exp >= player.maxExp) triggerLevelUp();
                }
            });

            damageTexts.forEach((d, i) => { d.y--; d.life--; if(d.life <= 0) damageTexts.splice(i, 1); });

            // UI
            let m = Math.floor(playTime / 60), s = playTime % 60;
            document.getElementById('timer').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            document.getElementById('ui-score').innerText = score;
            document.getElementById('exp-bar').style.width = (player.exp / player.maxExp * 100) + "%";
        }

        function draw() {
            ctx.fillStyle = "rgba(17, 17, 30, 0.4)";
            ctx.fillRect(0, 0, width, height);

            gems.forEach(g => { ctx.fillStyle = "#0f0"; ctx.beginPath(); ctx.arc(g.x, g.y, 4, 0, Math.PI*2); ctx.fill(); });
            bullets.forEach(b => { ctx.fillStyle = "#ff0"; ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, Math.PI*2); ctx.fill(); });
            orbits.forEach(o => { ctx.fillStyle = "#0ff"; ctx.beginPath(); ctx.arc(o.x, o.y, o.size, 0, Math.PI*2); ctx.fill(); });
            enemies.forEach(e => {
                ctx.fillStyle = e.isBoss ? "#f0f" : "#f33";
                ctx.fillRect(e.x - e.size, e.y - e.size, e.size*2, e.size*2);
                ctx.fillStyle = "red"; ctx.fillRect(e.x-e.size, e.y-e.size-10, e.size*2*(e.hp/e.maxHp), 5);
            });

            ctx.fillStyle = "#39f"; ctx.beginPath(); ctx.arc(player.x, player.y, player.size, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#f00"; ctx.fillRect(player.x-20, player.y+20, 40, 5);
            ctx.fillStyle = "#0f0"; ctx.fillRect(player.x-20, player.y+20, 40*(player.hp/player.maxHp), 5);

            ctx.fillStyle = "white"; ctx.textAlign = "center";
            damageTexts.forEach(d => ctx.fillText(d.text, d.x, d.y));
        }

        function end(win) {
            state = 'RESULT';
            screens.ui.classList.add('hidden');
            screens.result.classList.remove('hidden');
            document.getElementById('result-title').innerText = win ? "MISSION CLEAR!" : "GAME OVER";
            document.getElementById('result-title').style.color = win ? "#0f0" : "#f00";
            document.getElementById('result-score').innerText = score;
        }

        function loop() { if(state === 'PLAYING') { update(); draw(); requestAnimationFrame(loop); } }

        document.getElementById('btn-start').onclick = initGame;
        document.getElementById('btn-home').onclick = () => { screens.result.classList.add('hidden'); screens.home.classList.remove('hidden'); state = 'HOME'; };

    </script>
</body>
</html>
